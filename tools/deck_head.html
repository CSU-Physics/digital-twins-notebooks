<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 1 Slides: From Bits to Qubits</title>
<style>
  :root { --maroon:#99004C; --ink:#24313D; --muted:#6A626B; --line:#E4DCE0; --tint:#F8F4F6; --gold:#C9A227; --ok:#2E7D4F; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#2B2230; font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--ink); }
  #viewport { position:absolute; inset:0 0 44px 0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #stage { width:1280px; height:720px; flex-shrink:0; position:relative; transform-origin:center center; }
  .slide { position:absolute; inset:0; background:#fff; padding:56px 72px 64px; display:none; flex-direction:column; border-top:10px solid var(--maroon); }
  .slide.on { display:flex; }
  .slide h1 { font-family: Georgia, serif; color:var(--maroon); font-size:56px; margin:0 0 18px; line-height:1.1; }
  .slide h2 { font-family: Georgia, serif; color:var(--maroon); font-size:40px; margin:0 0 22px; line-height:1.15; }
  .slide p, .slide li { font-size:27px; line-height:1.45; margin:0 0 14px; }
  .slide ul { margin:0 0 10px 0; padding-left:34px; }
  .kicker { font-size:20px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
  .eq { background:var(--tint); border-left:6px solid var(--maroon); padding:16px 24px; font-size:34px; margin:10px 0 18px; font-family: Georgia, serif; }
  .small { font-size:20px !important; color:var(--muted); }
  .cols { display:flex; gap:40px; align-items:flex-start; flex:1; }
  .cols > div { flex:1; }
  .card { border:2px solid var(--line); border-radius:10px; padding:18px 22px; }
  .card h3 { margin:0 0 8px; font-size:27px; color:var(--maroon); }
  .card p { font-size:23px; margin:0; }
  table { border-collapse:collapse; font-size:26px; }
  th, td { border:1px solid var(--line); padding:10px 18px; text-align:left; }
  th { background:var(--tint); }
  .foot { position:absolute; left:72px; right:72px; bottom:20px; display:flex; justify-content:space-between; font-size:15px; color:var(--muted); }
  .reveal { margin-top:10px; }
  .reveal button { font-size:22px; padding:8px 18px; border:2px solid var(--maroon); background:#fff; color:var(--maroon); border-radius:6px; cursor:pointer; }
  .reveal .ans { display:none; margin-top:14px; background:#EEF6F0; border-left:6px solid var(--ok); padding:12px 20px; font-size:25px; line-height:1.45; }
  .reveal.open .ans { display:block; }
  .reveal.open button { display:none; }
  .title-slide { background: linear-gradient(135deg, #fff 0%, #fff 58%, var(--tint) 58%); }
  #bar { position:absolute; left:0; right:0; bottom:0; height:44px; background:#1E1722; display:flex; align-items:center; justify-content:center; gap:10px; color:#fff; font-size:14px; }
  #bar button { background:#3A2F40; color:#fff; border:0; border-radius:4px; padding:7px 14px; font-size:14px; cursor:pointer; }
  #bar button:hover { background:var(--maroon); }
  #count { min-width:70px; text-align:center; }
  svg text { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  @media print {
    @page { size: 1280px 720px; margin:0; }
    html, body { background:#fff; height:auto; }
    #bar { display:none; }
    #viewport { position:static; display:block; }
    #stage { transform:none !important; width:1280px; height:auto; }
    .slide { display:flex !important; position:relative; width:1280px; height:720px; page-break-after:always; break-after:page; }
    .reveal .ans { display:block !important; }
    .reveal button { display:none !important; }
  }
</style>
</head>
<body>
<div id="viewport"><div id="stage">
